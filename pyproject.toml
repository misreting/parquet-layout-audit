[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parquet-layout-audit"
version = "0.1.0"
description = "Audit Parquet files for row-group sizing, missing statistics, and unsorted data that defeats row-group pruning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "parquet-layout-audit"}]
keywords = ["parquet", "performance", "row-group", "pruning", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "pyarrow>=17.0",
    "duckdb>=1.0",
]

[project.urls]
Repository = "https://github.com/agentscope-ai-java/parquet-layout-audit"

[project.scripts]
parquet-layout-audit = "parquet_layout_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parquet_layout_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
